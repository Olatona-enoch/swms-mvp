<div>
  <app-header [title]="'Manage Complaints'" [subtitle]="'View and respond to user complaints'" [userName]="userName" [userInitials]="userInitials"></app-header>
  <div class="p-8 bg-gray-100">
    <div class="card bg-base-100 shadow-md rounded-xl">
      <div class="card-body p-6">
        <h2 class="text-xl font-semibold text-dark-gray mb-4">All Complaints ({{ complaints.length }})</h2>
        <div class="space-y-4">
          <div *ngFor="let c of complaints" class="border border-gray-200 rounded-lg p-4">
            <div class="flex items-start justify-between mb-2">
              <div>
                <h3 class="font-semibold text-dark-gray text-sm">{{ c.subject }}</h3>
                <p class="text-xs text-gray-400">{{ c.user_name }} ({{ c.user_email }}) - {{ c.created_at | date:'medium' }}</p>
              </div>
              <span class="badge border-none rounded-full px-3 py-1 text-xs font-medium" [ngClass]="getStatusClass(c.status)">{{ c.status }}</span>
            </div>
            <p class="text-sm text-medium-gray mb-3">{{ c.message }}</p>
            <div *ngIf="c.admin_response" class="bg-emerald-50 rounded-lg p-3 mb-2">
              <p class="text-xs font-semibold text-emerald-600 mb-1">Your Response:</p>
              <p class="text-sm text-dark-gray">{{ c.admin_response }}</p>
            </div>
            <button *ngIf="c.status === 'open'" (click)="respond(c)" class="btn btn-sm bg-custom-green hover:bg-emerald-600 text-white border-none rounded-lg">Respond & Resolve</button>
          </div>
          <div *ngIf="complaints.length === 0" class="text-center py-8"><p class="text-medium-gray">No complaints found.</p></div>
        </div>
      </div>
    </div>
  </div>
</div>
