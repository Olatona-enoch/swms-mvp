<div>
  <app-header
    [title]="'Notifications'"
    [subtitle]="'System alerts and updates'"
    [userName]="userName"
    [userInitials]="userInitials">
  </app-header>

  <div class="p-8 bg-gray-100 min-h-screen">
    <div class="card bg-white shadow-sm rounded-xl">
      <div class="card-body p-6">

        <!-- Header row -->
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-lg font-semibold text-dark-gray">All Notifications</h2>
          <button *ngIf="unreadCount > 0" (click)="markAllAsRead()"
            class="btn btn-ghost btn-sm text-custom-green hover:text-emerald-600 hover:bg-emerald-50 normal-case font-medium">
            Mark all as read
          </button>
        </div>

        <!-- Loading spinner -->
        <div *ngIf="isLoading" class="text-center py-16">
          <span class="loading loading-spinner loading-md text-custom-green"></span>
          <p class="text-sm text-medium-gray mt-3">Loading notifications...</p>
        </div>

        <!-- Notification list -->
        <div *ngIf="!isLoading" class="divide-y divide-gray-100">

            <div *ngFor="let n of visibleNotifications"
            (click)="onNotificationClick(n)"
            class="flex items-start gap-4 py-4 cursor-pointer transition-colors rounded-lg px-2 -mx-2"
            [class.bg-emerald-50]="!n.read"
            [class.hover:bg-emerald-100]="!n.read"
            [class.bg-white]="n.read"
            [class.hover:bg-gray-50]="n.read">

            <!-- Icon -->
            <div class="relative flex-shrink-0 mt-0.5">
              <div class="w-10 h-10 rounded-full flex items-center justify-center" [ngClass]="getIconBg(n)">

                <!-- Payment -->
                <svg *ngIf="getIconType(n) === 'payment'" class="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>

                <!-- Bin report -->
                <svg *ngIf="getIconType(n) === 'report'" class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>

                <!-- Pickup -->
                <svg *ngIf="getIconType(n) === 'pickup'" class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>

                <!-- User registered -->
                <svg *ngIf="getIconType(n) === 'user'" class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                </svg>

                <!-- System alert -->
                <svg *ngIf="getIconType(n) === 'alert'" class="w-5 h-5 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>

                <!-- Default info -->
                <svg *ngIf="getIconType(n) === 'info'" class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
              </div>

              <!-- Unread green dot -->
              <span *ngIf="!n.read"
                class="absolute -top-0.5 -right-0.5 w-3 h-3 bg-custom-green rounded-full border-2 border-white">
              </span>
            </div>

            <!-- Text content -->
            <div class="flex-1 min-w-0">
              <p class="text-sm text-dark-gray"
                [class.font-semibold]="!n.read"
                [class.font-medium]="n.read">
                {{ n.title }}
              </p>
              <p class="text-sm text-medium-gray mt-0.5 truncate">
                {{ n.description?.split('\n')[0] }}
              </p>
            </div>

            <!-- Timestamp -->
            <span class="text-xs text-light-gray whitespace-nowrap flex-shrink-0 mt-0.5">
              {{ n.time }}
            </span>
          </div>

          <!-- Empty state -->
          <div *ngIf="allNotifications.length === 0" class="text-center py-16">
            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <svg class="w-8 h-8 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
              </svg>
            </div>
            <p class="text-medium-gray text-sm">No notifications yet.</p>
          </div>
        </div>

        <!-- Load more -->
        <div *ngIf="!isLoading && hasMore" class="text-center pt-6 border-t border-gray-100 mt-2">
          <button (click)="loadMore()"
            class="btn btn-ghost btn-sm text-custom-green hover:text-emerald-600 hover:bg-emerald-50 normal-case font-medium">
            Load more notifications
          </button>
        </div>

      </div>
    </div>
  </div>
</div>
