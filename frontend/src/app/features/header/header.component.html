<header class="shadow-sm relative" style="z-index: 50;">
  <div class="px-8 py-6 flex items-center justify-between">
    <div>
      <h1 class="text-pageheader text-dark-gray font-semibold">{{ title }}</h1>
      <p class="text-sm text-medium-gray mt-1">welcome back, <span class="font-semibold text-[#2ECC71]">{{ userName }}</span></p>
    </div>
    <div class="flex items-center gap-4">
      <!-- Notifications bell -->
      <button (click)="goToNotifications()" class="relative p-2.5 border border-gray-200 rounded-full hover:bg-gray-50 transition-colors cursor-pointer" style="z-index: 51;">
        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
        </svg>
        <span *ngIf="unreadCount" class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] bg-red-500 rounded-full flex items-center justify-center">
          <span class="text-white text-[10px] font-bold">{{ unreadCount }}</span>
        </span>
      </button>
      <!-- User menu -->
      <div class="relative user-menu-container" style="z-index: 51;">
        <button (click)="toggleUserMenu()" class="flex items-center gap-3 px-4 py-2 border border-gray-200 rounded-full hover:bg-gray-50 transition-colors cursor-pointer">
          <div class="w-10 h-10 bg-custom-green rounded-full flex items-center justify-center text-white font-semibold text-sm">{{ userInitials }}</div>
          <span class="font-medium text-dark-gray text-sm hidden sm:inline">{{ userName }}</span>
        </button>
        <div *ngIf="showUserMenu" class="absolute right-0 top-14 bg-white shadow-lg rounded-xl border w-48 overflow-hidden" style="z-index: 100;">
          <button (click)="goToDashboard(); showUserMenu = false" class="w-full px-4 py-3 text-left text-sm text-dark-gray hover:bg-gray-50 flex items-center gap-2">
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            Dashboard
          </button>
          <button (click)="goToNotifications(); showUserMenu = false" class="w-full px-4 py-3 text-left text-sm text-dark-gray hover:bg-gray-50 flex items-center gap-2">
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
            Notifications
            <span *ngIf="unreadCount" class="ml-auto badge badge-sm bg-red-500 text-white border-none">{{ unreadCount }}</span>
          </button>
          <button (click)="goToSettings(); showUserMenu = false" class="w-full px-4 py-3 text-left text-sm text-dark-gray hover:bg-gray-50 flex items-center gap-2">
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            Settings
          </button>
          <div class="border-t"></div>
          <button (click)="logout()" class="w-full px-4 py-3 text-left text-sm text-red-600 hover:bg-red-50 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            Logout
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
